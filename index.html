<style>
:root{
  --bg:#F7F2EA; --ink:#3D4136; --muted:#7C7F6E; --line:#E3DACB;
  --plum:#6A7160; --plum2:#757C6A; --cream:#F7F2EA; --rose:#CFC4AE; --amber:#D9BD94;
  --serif:"Songti TC","Noto Serif TC","Noto Serif CJK TC",serif;
  --sans:"PingFang TC","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 18px 120px}

/* 分頁 */
.tabs{display:flex;gap:6px;background:#ECE4D6;border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:9px 0;border-radius:999px;font-size:15px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--plum);color:var(--cream)}

.date{font-size:14px;color:var(--muted);margin:0 0 2px}
h1{font-family:var(--serif);font-size:34px;line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:.02em}
.sub{font-size:15px;color:var(--muted);margin:0 0 16px;line-height:1.5}

/* 語音設定 */
.vset{display:block;margin:-8px 0 14px auto;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.vrow{display:flex;align-items:center;gap:10px;margin:14px 0 2px;font-size:15px}
.vrow span{width:40px;flex:none;font-weight:600}
.vrow select{flex:1;font:inherit;font-size:15px;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;min-width:0}
.vrow input[type=range]{flex:1;accent-color:var(--plum)}
.vrow small{width:52px;text-align:right;color:var(--muted)}
.vends{display:flex;justify-content:space-between;margin:0 62px 0 50px;font-size:12px;color:var(--muted)}

.vtest{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.7;margin-bottom:12px}
.vtest .ok::before{content:'✓ ';color:#3E8E63;font-weight:700}
.vtest .bad::before{content:'✗ ';color:#C0392B;font-weight:700}
.vtest .wait::before{content:'… ';color:var(--muted)}

/* 今天會用到 */
.gear{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:-12px 0 22px;display:grid;gap:8px}
.gear b{font-size:14px}
.gear div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gear i{font-style:normal;font-size:12px;color:var(--muted);width:34px}
.gear span{font-size:13px;background:#ECE4D6;border-radius:999px;padding:3px 10px}

/* 星期 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.week button{border:1px solid var(--line);background:transparent;border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.week b{font-size:15px;font-weight:600}
.week span{font-size:11px;color:var(--muted)}
.week button.today b{text-decoration:underline;text-underline-offset:3px}
.week button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.week button[aria-pressed=true] span{color:#E4E6D8}

.level{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.level button{flex:1;border:0;background:none;padding:8px 0;font-size:13px;color:var(--muted)}
.level button+button{border-left:1px solid var(--line)}
.level button[aria-pressed=true]{background:#ECE4D6;color:var(--ink);font-weight:600}

/* 舞台 */
.stage{background:var(--plum);border-radius:28px;position:relative;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;aspect-ratio:300/210}
.stage .tag{position:absolute;left:14px;top:12px;font-size:12px;color:#DCDFCF;background:rgba(255,255,255,.08);padding:3px 9px;border-radius:999px}
.fig{fill:none;stroke:var(--cream);stroke-linecap:round;stroke-linejoin:round}
.far{stroke:var(--rose)}
.head{fill:var(--cream)}
.floor{stroke:#8A907C;stroke-width:1.5}
.mat{fill:var(--plum2)}
.prop{fill:#808773}
.wall{fill:#71786A}
.band{stroke:var(--amber);fill:none;stroke-linecap:round}
.db{fill:var(--amber)}
.glow{fill:var(--amber)}

.hero .cap{position:absolute;left:18px;right:18px;bottom:14px;color:var(--cream);font-size:13px;opacity:.8}
.start{display:block;width:100%;margin:14px 0 26px;border:0;border-radius:18px;background:var(--amber);color:var(--ink);font-size:18px;font-weight:700;padding:16px}

/* 清單 */
h2{font-family:var(--serif);font-size:20px;margin:22px 0 4px;font-weight:700}
ol.list{list-style:none;margin:0;padding:0;counter-reset:n}
ol.list li{border-bottom:1px solid var(--line)}
ol.list button{width:100%;text-align:left;background:none;border:0;padding:13px 0;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px}
ol.list .n{font-family:var(--serif);color:var(--muted);font-size:15px}
ol.list .nm{font-size:16px;font-weight:600}
ol.list .ds{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
ol.list .src{font-size:11px;color:#6E7562;border:1px solid #CFC6B3;border-radius:999px;padding:2px 7px;white-space:nowrap}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin:18px 0 0}

/* 動作說明 */
.sheet{position:fixed;inset:0;background:rgba(61,65,54,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .box{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 18px 34px}
.sheet h3{font-family:var(--serif);font-size:26px;margin:16px 0 4px}
.sheet .meta{font-size:14px;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips span{font-size:12px;background:#ECE4D6;border-radius:999px;padding:3px 10px}
.sheet h4{font-size:15px;margin:18px 0 6px}
.sheet ol,.sheet ul{margin:0;padding-left:20px;line-height:1.7;font-size:15px}
.close{border:0;background:#ECE4D6;border-radius:999px;padding:6px 14px;font-size:14px;float:right}

/* 跟練 */
.player{position:fixed;inset:0;background:var(--plum);color:var(--cream);z-index:30;display:flex;flex-direction:column;overflow:auto}
.player .in{max-width:520px;width:100%;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;flex:1}
.ptop{display:flex;align-items:center;gap:10px;font-size:14px;color:#DCDFCF}
.ptop button{border:0;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;color:var(--cream);font-size:14px}
.ptop .grow{flex:1}
.bar{height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);width:0}
.player .stage{background:transparent;border-radius:0;margin:0 -16px}
.player .stage.dim svg{opacity:.45}
.pname{font-family:var(--serif);font-size:28px;margin:4px 0 2px;font-weight:700}
.pstate{font-size:15px;color:#DCDFCF;min-height:22px}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.big b{font-size:64px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.big span{font-size:20px;color:#DCDFCF}
.pcue{font-size:16px;line-height:1.5;min-height:48px;color:var(--cream)}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:auto;padding-top:16px}
.ctrl button{border:0;border-radius:16px;padding:15px 0;font-size:16px;background:rgba(255,255,255,.1);color:var(--cream)}
.ctrl .main{background:var(--amber);color:var(--ink);font-weight:700}

.pmeta{display:grid;gap:6px;margin:10px 0 4px}
.pmeta div{font-size:15px;line-height:1.45;color:var(--cream)}
.pmeta span{display:inline-block;min-width:44px;margin-right:8px;font-size:12px;color:var(--ink);background:#DCDFCF;border-radius:6px;padding:1px 6px;text-align:center}
.pbrief{margin:10px 0 0;padding:0;list-style:none;counter-reset:b}
.pbrief li{counter-increment:b;position:relative;padding:7px 0 7px 32px;font-size:17px;line-height:1.45;border-top:1px solid rgba(255,255,255,.08)}
.pbrief li::before{content:counter(b);position:absolute;left:0;top:7px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pcue:empty{display:none}
details.how{margin-top:14px;font-size:15px;line-height:1.7;color:#EEF0E4}
details.how summary{cursor:pointer;color:#DCDFCF}
details.how ol{padding-left:20px;margin:8px 0}
.done{text-align:center;margin:auto 0}
.done h2{font-size:34px;margin:0 0 8px}
.done p{color:#DCDFCF;font-size:16px;line-height:1.6}

/* 臉部運動 */
.fx-puff{fill:#959C86;stroke:var(--cream);stroke-width:2}
.fx-mouth{fill:none;stroke:var(--cream);stroke-width:3;stroke-linejoin:round}
.fx-mouth.open{fill:#4C5144}
.fx-arrow{fill:none;stroke:var(--amber);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fx-finger{fill:none;stroke:var(--amber);stroke-width:7;stroke-linecap:round;opacity:.6}
.fx-glow{fill:var(--amber)}

/* 呼吸提示 */
.breath[hidden]{display:none}
.breath{display:inline-block;align-self:flex-start;font-size:15px;font-weight:700;padding:4px 14px;border-radius:999px;margin:2px 0 6px;transition:background .3s}
.breath[data-w=in]{background:#C9D6CB;color:var(--ink)}
.breath[data-w=out]{background:var(--amber);color:var(--ink)}

/* 呼吸光圈 */
.player .stage{position:relative}
.player .stage svg{position:relative;z-index:1}
.orb{position:absolute;left:50%;top:50%;width:78%;aspect-ratio:1;border-radius:50%;z-index:0;opacity:0;
  transform:translate(-50%,-50%) scale(.5);transition:background-color .6s;pointer-events:none;
  background:radial-gradient(circle,currentColor 0%,currentColor 30%,transparent 70%)}
.orb[data-w=in]{color:#A9BCB2}
.orb[data-w=out]{color:#D9BD94}
.big{align-items:baseline}
.big .breath{margin-left:auto;align-self:center}

/* 刮痧臉部 */
.face-line{fill:none;stroke:var(--cream);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.face-hair{fill:var(--plum2)}
.face-skin{fill:#7A8170;stroke:var(--cream);stroke-width:3}
.trail{fill:none;stroke:var(--amber);stroke-width:6;stroke-linecap:round;opacity:.55}
.guide{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:3 6;opacity:.5}
.tool{fill:var(--amber)}
@media (prefers-reduced-motion:reduce){.sheet .box{transition:none}}

</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- 人形動畫引擎 ----------
const LEN = { T: 56, UA: 27, FA: 25, TH: 40, SH: 40, NK: 15, HR: 10 };
const rad = d => d * Math.PI / 180;

function normLimb(s) {
  if (!s) return s;
  const o = { ...s };
  if (o.a && !o.s) o.s = [1, 1];
  if (o.t && o.b === undefined) o.b = 1;
  return o;
}
function normFrame(f) {
  const o = { arch: 0, hd: 0, sw: 0, hw: 0, glow: 0, ...f };
  ['aN', 'aF', 'lN', 'lF'].forEach(k => (o[k] = normLimb(o[k])));
  return o;
}
function lerp(a, b, t) {
  if (typeof a === 'number') return typeof b === 'number' ? a + (b - a) * t : a;
  if (Array.isArray(a)) return a.map((v, i) => lerp(v, b ? b[i] : v, t));
  if (a && typeof a === 'object') {
    const o = {};
    for (const k in a) o[k] = b && k in b ? lerp(a[k], b[k], t) : a[k];
    return o;
  }
  return a;
}
function limbPts(base, spec, L1, L2) {
  if (spec.a) {
    const s = spec.s || [1, 1];
    const j = [base[0] + L1 * s[0] * Math.cos(rad(spec.a[0])), base[1] + L1 * s[0] * Math.sin(rad(spec.a[0]))];
    const e = [j[0] + L2 * s[1] * Math.cos(rad(spec.a[1])), j[1] + L2 * s[1] * Math.sin(rad(spec.a[1]))];
    return [j, e];
  }
  const dx = spec.t[0] - base[0], dy = spec.t[1] - base[1];
  let d = Math.hypot(dx, dy) || 0.001;
  const ux = dx / d, uy = dy / d;
  if (d >= L1 + L2 - 0.5) {
    return [[base[0] + ux * L1, base[1] + uy * L1], [base[0] + ux * (L1 + L2), base[1] + uy * (L1 + L2)]];
  }
  d = Math.max(d, Math.abs(L1 - L2) + 1);
  const along = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - along * along));
  const b = spec.b || 1;
  const j = [base[0] + ux * along - uy * h * b, base[1] + uy * along + ux * h * b];
  return [j, [spec.t[0], spec.t[1]]];
}

const easeSine = t => 0.5 - 0.5 * Math.cos(Math.PI * t);

const TEMPO = 1.25; // 動作放慢，初學者較好控制
function cycleLen(ex) { return ex.dur.reduce((a, b) => a + b, 0) * TEMPO; }

function poseAt(ex, ms) {
  const F = ex._frames || (ex._frames = ex.frames.map(normFrame));
  const n = F.length;
  if (n === 1) return F[0];
  ms = ms / TEMPO;
  const total = cycleLen(ex) / TEMPO;
  let t = ((ms % total) + total) % total;
  let i = 0;
  while (t > ex.dur[i]) { t -= ex.dur[i]; i++; }
  const k = ex.dur[i] ? t / ex.dur[i] : 0;
  return lerp(F[i], F[(i + 1) % n], ex.ease === 'linear' ? k : easeSine(k));
}

// 目前在第幾段動畫、該段進度 0–1
function segInfo(ex, ms) {
  const tot = cycleLen(ex) / TEMPO;
  let t = (((ms / TEMPO) % tot) + tot) % tot;
  let i = 0;
  while (i < ex.dur.length - 1 && t > ex.dur[i]) { t -= ex.dur[i]; i++; }
  return { i, k: ex.dur[i] ? Math.min(1, t / ex.dur[i]) : 0 };
}
// 呼吸深度 0（吐盡）–1（吸飽），給呼吸光圈用
function breathLevel(ex, ms) {
  const { i, k } = segInfo(ex, ms), B = ex.breath;
  if (B[i] === 'in') return { lv: easeSine(k), w: 'in' };
  if (B[i] === 'out') return { lv: 1 - easeSine(k), w: 'out' };
  for (let j = 1; j <= B.length; j++) {
    const w = B[(i - j + B.length) % B.length];
    if (w) return { lv: w === 'in' ? 1 : 0, w: w === 'in' ? 'hold-in' : 'hold-out' };
  }
  return { lv: 0.5, w: null };
}
function segAt(ex, ms) {
  let t = ((ms / TEMPO) % (cycleLen(ex) / TEMPO) + cycleLen(ex) / TEMPO) % (cycleLen(ex) / TEMPO);
  let i = 0;
  while (i < ex.dur.length - 1 && t > ex.dur[i]) { t -= ex.dur[i]; i++; }
  return i;
}

const P = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
const pl = (pts, cls, w) => `<polyline points="${pts.map(P).join(' ')}" class="${cls}" stroke-width="${w}"/>`;

function skeleton(ex, f) {
  const dir = [Math.cos(rad(f.t)), Math.sin(rad(f.t))];
  const perp = [-dir[1], dir[0]];
  const hip = f.p;
  const sh = [hip[0] + LEN.T * dir[0], hip[1] + LEN.T * dir[1]];
  const off = (pt, w) => [pt[0] + perp[0] * w, pt[1] + perp[1] * w];
  const hipN = off(hip, f.hw / 2), hipF = off(hip, -f.hw / 2);
  const shN = off(sh, f.sw / 2), shF = off(sh, -f.sw / 2);
  const ha = rad(f.t + f.hd);
  const head = [sh[0] + LEN.NK * Math.cos(ha), sh[1] + LEN.NK * Math.sin(ha)];
  const arm = (b, s) => { const [j, e] = limbPts(b, s, LEN.UA, LEN.FA); return [b, j, e]; };
  const leg = (b, s) => { const [j, e] = limbPts(b, s, LEN.TH, LEN.SH); return [b, j, e]; };
  const mid = [(hip[0] + sh[0]) / 2, (hip[1] + sh[1]) / 2];
  const ctrl = [mid[0] - perp[0] * f.arch * 2, mid[1] - perp[1] * f.arch * 2];
  return { hip, sh, hipN, hipF, shN, shF, head, ctrl,
    AN: arm(shN, f.aN), AF: arm(shF, f.aF), LN: leg(hipN, f.lN), LF: leg(hipF, f.lF) };
}

// 依動作範圍自動縮放鏡頭
function fitBox(ex) {
  if (ex._vb) return ex._vb;
  if (!ex._frames) ex._frames = ex.frames.map(normFrame);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const rot = ex.view === 'top' ? p => [250 - p[1], p[0] - 50] : p => p;
  const add = (q, r = 4) => { const p = rot(q); x0 = Math.min(x0, p[0] - r); y0 = Math.min(y0, p[1] - r); x1 = Math.max(x1, p[0] + r); y1 = Math.max(y1, p[1] + r); };
  const samples = [];
  const total = cycleLen(ex) * 1;
  for (let i = 0; i < 24; i++) samples.push(poseAt(ex, (total * i) / 24));
  samples.forEach(f => {
    const k = skeleton(ex, f);
    [k.hip, k.sh, ...k.AN, ...k.AF, ...k.LN, ...k.LF].forEach(p => add(p));
    add(k.head, LEN.HR + 3);
  });
  const pr = ex.props || {};
  if (pr.bed) { add([pr.bed[0], pr.bed[1]], 0); add([pr.bed[0] + Math.min(pr.bed[2], 90), 171], 0); }
  if (pr.pillow) { add([pr.pillow[0] - pr.pillow[2], pr.pillow[1] - pr.pillow[3]], 0); add([pr.pillow[0] + pr.pillow[2], pr.pillow[1]], 0); }
  if (ex.view !== 'top') y1 = Math.max(y1, 176);
  const pad = 16, AR = 300 / 210;
  x0 -= pad; x1 += pad; y0 -= pad; y1 += 6;
  let w = x1 - x0, h = y1 - y0;
  if (w / h < AR) { const nw = h * AR; x0 -= (nw - w) / 2; w = nw; }
  else { const nh = w / AR; y0 -= nh - h; h = nh; }
  return (ex._vb = [x0, y0, w, h]);
}

function renderPose(ex, f) {
  const side = ex.view === 'side' || !ex.view;
  const k = skeleton(ex, f);
  const vb = fitBox(ex);
  const pr = ex.props || {};
  const farCls = side ? 'fig far' : 'fig';
  let s = '';
  if (ex.view === 'top') s += `<g transform="rotate(90 150 100)"><rect x="100" y="-40" width="100" height="240" rx="8" class="mat"/>`;
  else s += `<line x1="${(vb[0] - 5).toFixed(0)}" y1="171" x2="${(vb[0] + vb[2] + 5).toFixed(0)}" y2="171" class="floor"/>`;
  if (pr.wall) s += `<rect x="92" y="-18" width="116" height="189" rx="2" class="wall"/>`;
  if (pr.bed) s += `<rect x="${pr.bed[0]}" y="${pr.bed[1]}" width="${pr.bed[2]}" height="${171 - pr.bed[1]}" rx="5" class="prop"/>`;
  if (pr.pillow) s += `<ellipse cx="${pr.pillow[0]}" cy="${pr.pillow[1]}" rx="${pr.pillow[2]}" ry="${pr.pillow[3]}" class="prop"/>`;
  if (f.glow > 0.01) s += `<circle cx="${k.hip[0]}" cy="${k.hip[1]}" r="${(10 + 8 * f.glow).toFixed(1)}" class="glow" opacity="${(0.25 + 0.55 * f.glow).toFixed(2)}"/>`;
  s += pl(k.LF, farCls, 7) + pl(k.AF, farCls, 6.5);
  s += `<path d="M${P(k.hip)} Q${P(k.ctrl)} ${P(k.sh)}" class="fig" stroke-width="10"/>`;
  if (f.sw > 0) s += pl([k.shF, k.sh, k.shN], 'fig', 8);
  if (f.hw > 0) s += pl([k.hipF, k.hip, k.hipN], 'fig', 9);
  s += `<circle cx="${k.head[0].toFixed(1)}" cy="${k.head[1].toFixed(1)}" r="${LEN.HR}" class="head"/>`;
  s += pl(k.LN, 'fig', 7) + pl(k.AN, 'fig', 6.5);
  if (pr.band === 'hands') s += pl([k.AN[2], k.AF[2]], 'band', 2.5);
  if (pr.band === 'feet') s += pl([k.AN[2], k.LN[2]], 'band', 2.5) + pl([k.AF[2], k.LF[2]], 'band', 2);
  (pr.db || []).forEach(n => {
    const h = n === 'n' ? k.AN[2] : k.AF[2];
    s += `<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="6" class="db"/>`;
  });
  if (ex.view === 'top') s += '</g>';
  return s;
}

// ---------- 基本姿勢 ----------
const ARMS_SIDE = { aN: { a: [176, 180] }, aF: { a: [178, 180] } };
const SUP = { p: [140, 160], t: 0, hd: 0, ...ARMS_SIDE };
const TABLE = { lN: { a: [270, 180] }, lF: { a: [272, 182] } };
const QUAD = { p: [118, 128], t: -10, hd: 25, aN: { a: [90, 90] }, aF: { a: [92, 90] }, lN: { a: [90, 180] }, lF: { a: [92, 180] } };
const PRONE = { p: [130, 158], t: 0, hd: -12, aN: { a: [22, -172] }, aF: { a: [26, -168] }, lN: { a: [180, 180] }, lF: { a: [181, 181] } };
const STAND = { p: [150, 90], t: -90, hd: 0, sw: 34, hw: 18, lN: { a: [88, 90] }, lF: { a: [92, 90] }, aN: { a: [88, 90] }, aF: { a: [92, 90] } };
const TOPSUP = { p: [150, 112], t: -90, hd: 0, sw: 34, hw: 20, aN: { a: [95, 92] }, aF: { a: [85, 88] } };

const circleFrames = (() => {
  const out = [];
  for (let i = 0; i < 8; i++) {
    const th = (i / 8) * Math.PI * 2;
    const a = 186 + 9 * Math.sin(th), s = 1 + 0.07 * Math.cos(th);
    out.push({ ...QUAD, lN: { a: [a, a], s: [s, s] } });
  }
  return out;
})();

// dose: [第1–2週, 第3–4週, 第5週起]
const EX = {
  catcow: {
    pose: '四足跪姿', brief: ['吸氣：塌腰、抬頭', '吐氣：拱背、收下巴', '跟著呼吸慢慢交替'],
    name: '貓牛式', tags: ['伸展', '骨盆前傾'], kind: 'reps', reps: [10, 10, 12], sets: [1, 1, 1], rpc: 1,
    frames: [{ ...QUAD, arch: -8, hd: -20 }, { ...QUAD, arch: 11, hd: 60 }], dur: [2200, 2200],
    cue: '吸氣塌腰抬頭，吐氣拱背收下巴',
    steps: ['四足跪姿：手在肩膀正下方，膝蓋在髖部正下方。', '吸氣，肚子往下沉、胸口往前推、視線往前上方。', '吐氣，背往上拱成圓弧，下巴收向胸口，尾椎往下捲。', '跟著呼吸慢慢做，一節一節活動脊椎。'],
    tips: ['動作慢，不要甩腰。', '久坐後先做這個，讓腰背暖起來。']
  },
  hipflex: {
    pose: '床邊俯趴，一腳放床上、一腳往後伸', brief: ['前腳彎曲放床上，後腳伸直點地', '收肚子、夾臀，骨盆往床面壓', '感覺後腿髖部前側拉開，自然呼吸'],
    name: '床邊弓步髖屈肌伸展', src: 'ZZ練瑜伽', tags: ['骨盆前傾', '伸展'], kind: 'hold', secs: [60, 60, 90], sets: [1, 1, 1], side: true,
    props: { bed: [164, 122, 136] },
    frames: [
      { p: [172, 112], t: 0, hd: -15, aN: { a: [20, -10] }, aF: { a: [26, -14] }, lN: { a: [14, 182] }, lF: { a: [136, 136] } },
      { p: [172, 115], t: 1, hd: -15, aN: { a: [18, -10] }, aF: { a: [24, -14] }, lN: { a: [14, 182] }, lF: { a: [134, 134] } }
    ], dur: [2600, 2600],
    cue: '後腿大腿前側到髖部有拉扯感',
    steps: ['趴在床邊，一腳彎曲放在床上，另一腳往後伸直、腳尖點地。', '肚子微收、臀部輕輕夾緊，骨盆往床面方向下壓。', '感覺後腿的大腿前側和髖部前方被拉開，自然呼吸。', '時間到換邊。'],
    tips: ['這是改善骨盆前傾最關鍵的伸展：久坐會讓髖屈肌變短，把骨盆往前拉。', '不要塌腰，拉伸感應該在髖部前側，不是下背。']
  },
  wiper: {
    pose: '仰躺屈膝，雙腳踩地', brief: ['雙腳比肩寬，肩膀貼地', '雙膝一起倒向一側', '回到中間，再倒向另一側'],
    name: '仰躺雙腿左右擺動', src: 'ZZ練瑜伽', tags: ['伸展', '腹部'], kind: 'reps', reps: [12, 16, 16], sets: [1, 1, 1], rpc: 2, view: 'top',
    frames: [

// 在手機上實際檢查：有沒有中文語音、語音有沒有開始和播完、提示音能不能響
function runVoiceTest(out) {
  out.hidden = false;
  const lines = [];
  const show = () => (out.innerHTML = lines.map(l => `<div class="${l[0]}">${esc(l[1])}</div>`).join(''));
  const add = (ok, txt) => { lines.push([ok === true ? 'ok' : ok === false ? 'bad' : 'wait', txt]); show(); return lines.length - 1; };
  const set = (i, ok, txt) => { lines[i] = [ok ? 'ok' : 'bad', txt]; show(); };
  if (!('speechSynthesis' in window)) { add(false, '這個瀏覽器不支援語音播放，請改用 Safari 或 Chrome 打開。'); return; }
  pickVoice();
  const zh = zhVoices();
  add(zh.length > 0, zh.length ? `找到 ${zh.length} 個中文聲音` : '沒有找到中文聲音，會用系統預設聲音');
  add(!!VOICE.voice, VOICE.voice ? `使用聲音：${VOICE.voice.name}（${VOICE.voice.lang}）` : '尚未選到指定聲音');
  unlockAudio(); beep(660, 160);
  add(actx && actx.state === 'running', actx && actx.state === 'running' ? '提示音：已播放一聲「嗶」' : '提示音：音效尚未啟動，請再按一次測試');
  const was = voiceOn; voiceOn = true;
  const iStart = add(null, '語音：等待開始播放…');
  let started = false;
  let finished = false;
  say('語音測試。第一句。這是第二句，用來確認長段說明可以完整念完。聽得到嗎？', false, ok => {
    finished = true;
    set(iStart, ok, ok ? '語音：完整播放完畢，運作正常' : '語音：播放中斷或失敗，請看下方說明');
    if (!ok) add(false, '請確認手機沒有開啟靜音、媒體音量已調高，再重新測試。');
  }, () => { started = true; if (!finished) { lines[iStart] = ['wait', '語音：正在播放…']; show(); } });
  voiceOn = was;
  setTimeout(() => {
    if (!started && lines[iStart][0] === 'wait') {
      set(iStart, false, '語音：3 秒內沒有開始播放');
      add(false, '請確認手機沒有開啟靜音、媒體音量已調高；iPhone 可到「設定 → 輔助使用 → 朗讀內容」確認中文聲音已下載。');
    }
  }, 3000);
}

// ---------- 聲音與語音 ----------
let actx = null, voiceOn = true;
// iOS 需要在使用者點按時先喚醒音效，之後計時器觸發的嗶聲才有聲音
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
    const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
    s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch (e) {}
}
function beep(freq = 880, ms = 120) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + ms / 1000);
    o.start(); o.stop(actx.currentTime + ms / 1000);
  } catch (e) {}
}
// ---------- 語音聲音：挑手機上最自然的中文聲音，音調調低讓聲音比較溫和 ----------
// 預設：婷婷（zh-CN）、音調 0.85、語速 1.05
const VOICE = { voice: null, pitch: 0.85, rate: 1.05, prefer: /tingting|婷婷/i };
function zhVoices() {
  if (!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => /^zh|cmn/i.test(v.lang));
}
function voiceScore(v) {
  let s = 0;
  if (/TW|Hant/i.test(v.lang)) s += 40; else if (/HK/i.test(v.lang)) s += 15; else s += 10;
  if (/enhanced|premium|增強|高品質|natural|neural/i.test(v.name)) s += 30;
  if (/google/i.test(v.name)) s += 5;
  if (v.localService) s += 3;
  return s;
}
function pickVoice() {
  const list = zhVoices();
  if (!list.length) return;
  if (VOICE.voice && list.some(v => v.name === VOICE.voice.name)) return;

// 語音播放：
// - 長段說明拆成一句一句排隊播放（Chrome 單句超過約 15 秒會中斷）
// - 自己記錄「正在說話」的時間，iOS 的 speaking 狀態有時不準
// - soft：呼吸提示等次要語音，正在說話時就略過，不打斷

  parts.forEach(p => {
    while (p.length > 45) { const k = p.lastIndexOf('，', 45); const cut = k > 10 ? k + 1 : 45; out.push(p.slice(0, cut)); p = p.slice(cut); }

    // 跟著做的提示（吸氣、吐氣、保持…）兩句之間至少隔 2 秒，避免念太快
    if (soft === true && t.length <= 6 && now - lastSoft < 2000) return null;
    if (soft === true) lastSoft = now;

    const id = ++sayId, chunks = splitSpeech(t);

      if (VOICE.voice) { u.voice = VOICE.voice; u.lang = VOICE.voice.lang; } else u.lang = 'zh-TW';
      u.rate = VOICE.rate; u.pitch = VOICE.pitch;
      if (i === 0) { first = u; u.onstart = () => { logSpeech('start'); onstart && onstart(); }; }
      const last = i === chunks.length - 1;
      u.onend = () => { if (last && id === sayId) { busyUntil = 0; logSpeech('end'); onend && onend(true); } };
      u.onerror = e => {
        logSpeech('error:' + (e && e.error));

    if (b.type === 'gear') {
      const g = gearOf(b);
      say(`開始前先準備。${g.tools.length ? '器材：' + g.tools.join('、') + '。' : ''}地點：${g.places.join('、')}。${b.face ? '整個過程保持自然呼吸。' : ''}準備好了，請按開始。`);
      return;
    }
    if (b.type === 'work') {
      const head = [b.side, b.sets > 1 ? `第${b.set}組` : ''].filter(Boolean).join('，');
      let amount;
      if (it.face) amount = `${b.reps}${it.lab}`;
      else if (it.kind === 'hold') amount = `保持${b.dur}秒`;
      else amount = `${Math.round(b.dur / repSec(it))}下`;
      say(`${head ? head + '，' : ''}${amount}，開始`);
    } else if (b.type === 'rest') say(`休息${b.dur}秒`);
    else if (b.type === 'switch') say(b.gua !== undefined ? '換左臉' : '換邊');
    else if (b.type === 'prep') {
      // 說明念完才開始最後 5 秒倒數
      const txt = it.face
        ? (b.gua === FX.length ? '臉部運動完成，接下來刮痧。先在臉和脖子擦上足量的油或精華，拿起刮痧板。畫面就像鏡子，每個動作先做右臉，再做左臉。' : '') + facePrepText(it)
        : (b.extra || '') + prepText(it);
      const token = ++prepToken, est = speechSec(txt);
      const u = say(txt, false, () => {
        if (token !== prepToken || blocks[bi] !== b) return;
        prepWait = false; b.dur = el + (it.fx ? 3 : 5);  // 臉部運動倒數 3 秒，其餘 5 秒
      });
      if (u) { prepWait = true; b.estMs = (est / VOICE.rate) * 1000; b.cd = it.fx ? 3 : 5; }
    }
  }
  function go(i) {
    if (i >= blocks.length) return finish();
    awake.poke();
    if (blocks[bi] && blocks[bi].type === 'gear') mountedKey = '';  // 離開器材畫面時重新顯示動作資訊
    gearDrawn = false;
    bi = Math.max(0, i); el = 0; lastSec = -1; lastSeg = -1; announce(); beep(660, 140);
  }
  function finish() {
    running = false; cancelAnimationFrame(raf); awake.stop();
    say('全部完成，做得很好');
    node.querySelector('.in').innerHTML = `<div class="done"><h2>完成了</h2>
      <p>${esc(title)}，共 ${exCount} 個項目，約 ${Math.round(total / 60)} 分鐘。<br>${offerBed ? '別忘了今天的床邊伸展。' : '記得到習慣追蹤器打勾。'}</p>
      ${offerBed ? '<button class="start" id="pBed">接著做床邊伸展（約 ' + listMin(BEDSET, lv) + ' 分鐘）</button>' : ''}
      <button class="start" id="pBack" style="background:rgba(255,255,255,.12);color:var(--cream)">回到首頁</button></div>`;
    node.querySelector('#pBack').onclick = close;
    if (offerBed) node.querySelector('#pBed').onclick = () => { close(); startPlayer(buildList(BEDSET, lv), '每日床邊伸展', lv); };
  }
  function close() {
    cancelAnimationFrame(raf); awake.stop();
    try { speechSynthesis.cancel(); } catch (e) {}
    node.remove(); document.body.style.overflow = '';
  }

  // 計時項目的語音：每 30 秒、最後 10 秒、倒數 5 秒
  function timeCues(b, left) {
    if (left === lastSec || !running) return;
    lastSec = left;
    const passed = Math.round(b.dur - left);
    if (left >= 1 && left <= 5) { if (passed >= 2) { say(String(left), b.type === 'prep' ? 'count' : false); beep(990, 60); } return; } // 剛開始的提示語不被倒數打斷
    if (left === 10 && b.dur > 12) { say('最後10秒'); return; }
    if (passed > 0 && passed % 30 === 0 && left > 10 && b.type !== 'prep') say(`還有${left}秒`);
  }

  function setOrb(lv, w) {
    if (lv === null) { orb.style.opacity = 0; return; }
    orb.style.opacity = (0.22 + 0.4 * lv).toFixed(2);
    orb.style.transform = `translate(-50%,-50%) scale(${(0.45 + 0.6 * lv).toFixed(3)})`;
    orb.dataset.w = w && w.includes('in') ? 'in' : 'out';
  }

  let gearDrawn = false;
  function drawGear(b, ts) {
    const nw = nextWork(bi), sit = itemOf(nw);
    const key = (nw.gua !== undefined ? 'g' + nw.gua : nw.id) + (nw.mirror ? 'm' : '');
    if (key !== mountedKey) { mounted = sit.fx ? mountFx(svg, sit) : sit.face ? mountFace(svg, sit, !!nw.mirror) : mountBody(svg, sit); mountedKey = key; }
    mounted.draw(ts);
    q('pStage').classList.add('dim'); setOrb(null); br.hidden = true;
    if (gearDrawn) return;
    gearDrawn = true;
    const g = gearOf(b);
    q('pPos').textContent = '開始前';
    q('pBar').style.width = '0%';
    q('pName').textContent = '準備器材';
    q('pState').textContent = `第一個動作：${sit.name}`;
    q('pBig').textContent = ''; q('pUnit').textContent = '';
    q('pMeta').innerHTML = (g.tools.length ? `<div><span>器材</span>${esc(g.tools.join('、'))}</div>` : '') + `<div><span>地點</span>${esc(g.places.join('、'))}</div>`;
    q('pBrief').innerHTML = g.tools.map(t => {
      const u = [...new Set(g.use[t] || [])];
      const txt = u.length > 3 ? `大部分地板動作（${u.length} 個）` : u.join('、');
      return `<li>${esc(t)}${txt ? '：' + esc(txt) : ''}</li>`;
    }).join('');
    q('pCue').textContent = '都準備好了，按「開始」。';
    q('pPlay').textContent = '開始';
  }

  function frame(ts) {
    raf = requestAnimationFrame(frame);
    if (last === null) last = ts;
    const dt = Math.min(0.25, (ts - last) / 1000); last = ts;
    const b = blocks[bi];
    if (b.type === 'gear') { drawGear(b, ts); return; }
    if (running) {
      el += dt;
      if (b.type === 'prep' && prepWait) {
        // 說明還沒念完：停在倒數 5 秒前等待；語音異常時用估計時間的兩倍作保險
        // 有些手機念完不會通知：估計時間過後、語音也停了就直接開始倒數，最多只多等一點點
        const ms = el * 1000, est = b.estMs || 15000;
        const silent = !speechSynthesis.speaking && !speechSynthesis.pending;
        if ((ms > est + 1200 && silent) || ms > est * 1.35 + 2500) { prepWait = false; b.dur = el + (b.cd || 5); }
        else b.dur = Math.max(b.dur, el + (b.cd || 5) + 0.01);
      }
    }
    if (el >= b.dur) { go(bi + 1); return; }
    const it = itemOf(b);
    const show = b.type === 'work' ? b : nextWork(bi) || b;
    const sit = itemOf(show);
    const key = (show.gua !== undefined ? 'g' + show.gua : show.id) + (show.mirror ? 'm' : '');
    if (key !== mountedKey) {
      mounted = sit.fx ? mountFx(svg, sit) : sit.face ? mountFace(svg, sit, !!show.mirror) : mountBody(svg, sit);
      mountedKey = key;
      const gs = s => Math.round(s.strokes * s.unit / 1000);
      const chips = sit.face
        ? [['姿勢', sit.pose], ['板子', sit.tool], ['次數', `${sit.fx ? '' : '每側 '}${sit.strokes} ${sit.lab}，約 ${gs(sit)} 秒`]]
        : [['姿勢', sit.pose], ['次數', doseText(sit, lv)]];
      q('pMeta').innerHTML = chips.filter(c => c[1]).map(([k, v]) => `<div><span>${k}</span>${esc(v)}</div>`).join('');
      q('pBrief').innerHTML = (sit.brief || []).map(s => `<li>${esc(s)}</li>`).join('');
      q('pSteps').innerHTML = sit.face ? `<li>${esc(sit.note)}</li>` : sit.steps.map(s => `<li>${esc(s)}</li>`).join('');
      const tag = q('pTag');
      tag.hidden = !(sit.view === 'top');
      tag.textContent = '俯視圖';
    }
    const animMs = b.type === 'work' ? el * 1000 : ts;
    mounted.draw(animMs);
    q('pStage').classList.toggle('dim', b.type !== 'work');

    // 呼吸：語音提示＋光圈縮放
    if (b.type === 'work' && !it.face && it.breath) {
      const ms = el * 1000, { lv: L, w } = breathLevel(it, ms);
      setOrb(L, w);
      const sg = segAt(it, ms);
      if (sg !== lastSeg) {
        lastSeg = sg;
        const ww = it.breath[sg];
        if (ww) {
          const txt = ww === 'in' ? '吸氣' : '吐氣';
          br.textContent = txt; br.dataset.w = ww; br.hidden = false;
          if (el > 0.4 && running) say(txt, true);
        }
      }
    } else if (b.type === 'work' && it.fx && it.cues) {
      // 臉部運動：依動作階段提示「保持」「放鬆」等
      setOrb(null);
      const sg = fxAt(it, el * 1000).i;
      if (sg !== lastSeg) {
        lastSeg = sg;
        const c = it.cues[sg];
        if (c && b.dur - el > 1.5) { br.textContent = c; br.dataset.w = /放鬆|回正/.test(c) ? 'out' : 'in'; br.hidden = false; if (el > 0.4 && running) say(c, true); }
      }
    } else if (b.type === 'rest' || b.type === 'switch') {
      // 休息時：吸 4 秒、吐 6 秒的恢復呼吸，只有畫面提示
      const c = (el % 10);
      const inh = c < 4, L = inh ? easeSine(c / 4) : 1 - easeSine((c - 4) / 6);
      setOrb(L, inh ? 'in' : 'out');
      br.textContent = inh ? '慢慢吸氣' : '慢慢吐氣'; br.dataset.w = inh ? 'in' : 'out'; br.hidden = false;
    } else { setOrb(null); br.hidden = true; }

    const left = Math.ceil(b.dur - el);
    if (isTimed(b) && !(b.type === 'prep' && prepWait)) timeCues(b, left);

    const done = blocks.slice(0, bi).reduce((a, x) => a + x.dur, 0) + el;
    q('pBar').style.width = Math.min(100, 100 * done / total).toFixed(1) + '%';
    const exIdx = (b.idx ?? b.gua) + 1;
    q('pPos').textContent = `第 ${exIdx} / ${exCount} 項`;
    q('pPlay').textContent = running ? '暫停' : '繼續';

    if (b.type === 'work') {
      q('pName').textContent = it.name;
      const st = [b.side, b.sets > 1 ? `第 ${b.set} / ${b.sets} 組` : ''].filter(Boolean).join('　');
      q('pState').textContent = st;
      if (it.face) {
        const cur = Math.min(b.reps, Math.floor(el * 1000 / it.unit) + 1);
        q('pBig').textContent = cur; q('pUnit').textContent = `/ ${b.reps} ${it.lab}`;
      } else if (it.kind === 'hold') {
        q('pBig').textContent = left; q('pUnit').textContent = '秒';
      } else {
        const rs = repSec(it), reps = Math.round(b.dur / rs);
        const cur = Math.min(reps, Math.floor(el / rs) + 1);
        q('pBig').textContent = cur; q('pUnit').textContent = `/ ${reps} 下`;
      }
      q('pCue').textContent = '';
    } else {
      const label = { rest: '休息', prep: '準備', switch: b.gua !== undefined ? '換左臉' : '換邊' }[b.type];
      q('pName').textContent = label;
      q('pState').textContent = b.type === 'rest' ? `下一組：${sit.name}` : sit.name;
      if (b.type === 'prep' && prepWait) { q('pBig').textContent = '…'; q('pUnit').textContent = '語音說明中'; }
      else { q('pBig').textContent = left; q('pUnit').textContent = '秒'; }
      q('pCue').textContent = b.type === 'rest' ? '喝口水，跟著光圈慢慢呼吸' : '';
    }
  }

  q('pPlay').onclick = () => {
    if (blocks[bi].type === 'gear') { go(bi + 1); return; }
    running = !running;
    try { running ? speechSynthesis.resume() : speechSynthesis.pause(); } catch (e) {}
  };
  q('pNext').onclick = () => go(bi + 1);
  q('pPrev').onclick = () => (el > 2 ? go(bi) : go(bi - 1));
  q('pClose').onclick = close;
  q('pVoice').onclick = () => {
    voiceOn = !voiceOn; setVoiceLabel();
    if (!voiceOn) { try { speechSynthesis.cancel(); } catch (e) {} if (prepWait) { prepWait = false; blocks[bi].dur = el + 5; } }
  };
  announce();
  raf = requestAnimationFrame(frame);
}

render();

</script>
</body>
</html>
